services:
  waf:
    image: owasp/modsecurity-crs:nginx
    ports:
      - "80:8080"
    environment:
      # Adresse de l'API de P3 (a ajuster avec P3)
      BACKEND: "http://api:8000"
      # On = bloque les attaques ; DetectionOnly = observe seulement
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
    networks:
      - app

networks:
  app:
    external: true
