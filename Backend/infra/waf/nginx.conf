events {}

http {
  # Point d'entrée unique. C'est ici qu'on branchera un vrai WAF
  # (ex. ModSecurity + règles OWASP CRS) pour le pilier Cybersécurité.
  upstream web_up     { server web:80; }
  upstream payment_up { server payment-api:8080; }
  upstream auth_up    { server auth-service:8080; }

  server {
    listen 80;

    location /api/  { proxy_pass http://payment_up/; }
    location /auth/ { proxy_pass http://auth_up/; }
    location /      { proxy_pass http://web_up; }
  }
}
