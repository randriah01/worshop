
# NovaPay - Exclusions ciblees pour les captures faciales.
# OWASP CRS reste actif sur les autres parametres et routes.

SecRule REQUEST_URI "@rx ^/auth/face/(enroll|login/verify)$" \
    "id:1001200,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=932235;ARGS:json.images.array_0,\
        ctl:ruleRemoveTargetById=932235;ARGS:json.images.array_1,\
        ctl:ruleRemoveTargetById=932235;ARGS:json.images.array_2,\
        ctl:ruleRemoveTargetById=932260;ARGS:json.images.array_0,\
        ctl:ruleRemoveTargetById=932260;ARGS:json.images.array_1,\
        ctl:ruleRemoveTargetById=932260;ARGS:json.images.array_2,\
        ctl:ruleRemoveTargetById=934170;ARGS:json.images.array_0,\
        ctl:ruleRemoveTargetById=934170;ARGS:json.images.array_1,\
        ctl:ruleRemoveTargetById=934170;ARGS:json.images.array_2,\
        ctl:ruleRemoveTargetById=941130;ARGS:json.images.array_0,\
        ctl:ruleRemoveTargetById=941130;ARGS:json.images.array_1,\
        ctl:ruleRemoveTargetById=941130;ARGS:json.images.array_2,\
        ctl:ruleRemoveTargetById=941170;ARGS:json.images.array_0,\
        ctl:ruleRemoveTargetById=941170;ARGS:json.images.array_1,\
        ctl:ruleRemoveTargetById=941170;ARGS:json.images.array_2"


# NovaPay - Autoriser DELETE uniquement pour la révocation des passkeys.
# Toutes les autres protections CRS restent actives.

SecRule REQUEST_URI "@rx ^/auth/face/passkeys/[0-9]+$" \
    "id:1001201,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_METHOD "@streq DELETE" \
        "t:none,ctl:ruleRemoveById=911100"
