# Zone de limitation de débit (contexte http, chargée via conf.d/).
# La zone est TOUJOURS déclarée mais n'est APPLIQUÉE que lorsque le
# remediation-engine dépose /etc/nginx/dynamic/ratelimit.inc (voir default.conf.template).
#   - clé    : adresse IP du client
#   - débit  : 10 req/s par IP (la rafale tolérée est réglée par le moteur)
#   - mémoire: 10 Mo ≈ 160 000 IP
limit_req_zone $binary_remote_addr zone=novapay_perip:10m rate=10r/s;
