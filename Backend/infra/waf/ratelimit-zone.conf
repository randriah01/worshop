# Zones de limitation de débit (contexte http, chargées via conf.d/).
# Les zones sont TOUJOURS déclarées mais ne sont APPLIQUÉES que lorsque le
# remediation-engine dépose /etc/nginx/dynamic/ratelimit.inc (voir default.conf.template).
#
# Deux « voies » pour qu'une attaque anonyme n'étouffe pas les paiements légitimes,
# même quand toutes les requêtes semblent venir de la même IP (NAT, Docker Desktop,
# partage de connexion) :
#   - requêtes SANS jeton (cas d'une attaque basique) → quota par adresse IP ;
#   - requêtes AVEC jeton Bearer (utilisateur connecté) → quota par jeton.
# Une clé vide = requête non comptée dans cette zone.
map $http_authorization $rl_anon_key { default ""; "" $binary_remote_addr; }
map $http_authorization $rl_auth_key { default $http_authorization; "" ""; }

limit_req_zone $rl_anon_key zone=novapay_anon:10m rate=10r/s;
limit_req_zone $rl_auth_key zone=novapay_auth:10m rate=10r/s;
