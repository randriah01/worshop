name: novapay

services:
  # --- Entrée réseau (reverse proxy / futur WAF) ---
  waf:
    image: nginx:alpine
    container_name: novapay-waf
    ports:
      - "80:80"
    volumes:
      - ./infra/waf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - payment-api
      - auth-service
    networks: [novapay]

  # --- Développement : SI de paiement ---
  # Dashboard React (dossier ../Frontend) : construit puis servi par nginx.
  # Le Dockerfile est intégré ici (dockerfile_inline) — aucun fichier séparé.
  web:
    build:
      context: ../Frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        RUN npm run build
        FROM nginx:alpine
        RUN printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  index index.html;\n  location / { try_files $$uri /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
    container_name: novapay-web
    networks: [novapay]

  payment-api:
    build: ./services/payment-api
    container_name: novapay-payment-api
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [novapay]

  auth-service:
    build: ./services/auth-service
    container_name: novapay-auth
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [novapay]

  postgres:
    image: postgres:16-alpine
    container_name: novapay-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [novapay]

  # --- Infrastructure : observabilité ---
  prometheus:
    image: prom/prometheus:latest
    container_name: novapay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [novapay]

  loki:
    image: grafana/loki:2.9.0
    container_name: novapay-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    networks: [novapay]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: novapay-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [novapay]

  grafana:
    image: grafana/grafana:latest
    container_name: novapay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    depends_on:
      - prometheus
      - loki
    networks: [novapay]

  # --- IA/Data et Remédiation : à activer quand les composants sont prêts ---
  # ml-detector:
  #   build: ./services/ml-detector
  #   container_name: novapay-ml
  #   networks: [novapay]
  #
  # remediation-engine:
  #   build: ./services/remediation-engine
  #   container_name: novapay-remediation
  #   networks: [novapay]

volumes:
  pgdata:
  lokidata:

networks:
  novapay:
    driver: bridge
